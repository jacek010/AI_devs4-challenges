<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 Agent UI</title>
<style>
:root {
  --bg:          #0d1117;
  --bg2:         #161b22;
  --bg3:         #21262d;
  --border:      #30363d;
  --text:        #c9d1d9;
  --text-muted:  #8b949e;
  --cyan:        #39c5d0;
  --yellow:      #d4a520;
  --magenta:     #c678dd;
  --green:       #3fb950;
  --red:         #f85149;
  --orange:      #e3b341;
  --blue:        #58a6ff;
  --sidebar-w:   230px;
  --header-h:    48px;
  --font-mono:   'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
  --font-ui:     -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius:      6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────── */
#header {
  height: var(--header-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 10;
}
#header .logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
#header .subtitle {
  color: var(--text-muted);
  font-size: 11px;
}
#header .spacer { flex: 1; }
#header .ws-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
}
#header .ws-dot.ok  { background: var(--green); }
#header .ws-dot.err { background: var(--red); }
#status-label {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}
#status-label.running { color: var(--orange); font-weight: 600; }
#status-label.done    { color: var(--green); }
#status-label.stopped { color: var(--red); }

/* ── Layout ─────────────────────────────────────────────── */
#layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ─────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-title {
  padding: 10px 12px 8px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#sessions-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
.session-row {
  display: flex;
  align-items: center;
  padding: 4px 8px 4px 12px;
  gap: 6px;
  border-radius: var(--radius);
  margin: 1px 4px;
}
.session-row:hover { background: var(--bg3); }
.session-name {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}
.btn-del {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  font-size: 13px;
  opacity: 0.4;
  color: var(--red);
  line-height: 1;
  flex-shrink: 0;
}
.btn-del:hover { opacity: 1; background: rgba(248,81,73,.15); }
.no-sessions {
  padding: 12px;
  color: var(--text-muted);
  font-style: italic;
  font-size: 12px;
}

/* ── Main ────────────────────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Task Setup ──────────────────────────────────────────── */
#task-setup {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ts-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ts-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .05em;
}
select, textarea, input[type="text"] {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  padding: 7px 10px;
  font-family: var(--font-ui);
  font-size: 13px;
  outline: none;
  width: 100%;
}
select { cursor: pointer; }
select:focus, textarea:focus, input[type="text"]:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(88,166,255,.15);
}
#custom-task {
  min-height: 80px;
  max-height: 200px;
  resize: vertical;
  font-family: var(--font-mono);
  font-size: 12px;
}
.ts-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.toggle-label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 12px;
  user-select: none;
  margin-right: auto;
}
.toggle-label input[type="checkbox"] { cursor: pointer; accent-color: var(--blue); }

/* ── Buttons ─────────────────────────────────────────────── */
.btn {
  padding: 6px 14px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font-ui);
  white-space: nowrap;
  transition: opacity .15s, filter .15s;
}
.btn:hover  { filter: brightness(1.12); }
.btn:active { filter: brightness(.92); }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.btn-green  { background: #238636; color: #fff; }
.btn-blue   { background: #1f6feb; color: #fff; }
.btn-orange { background: #9e6a03; color: #fff; }
.btn-red    { background: #b91c1c; color: #fff; }
.btn-ghost  { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }

/* ── Run controls ────────────────────────────────────────── */
#run-controls {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#run-controls .run-task-label {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── Log viewer ──────────────────────────────────────────── */
#log-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.55;
  background: var(--bg);
  scroll-behavior: smooth;
}
#log-container:empty::before {
  content: 'Wybierz zadanie i kliknij Start aby uruchomić agenta.';
  color: var(--text-muted);
  font-style: italic;
  display: block;
  padding: 24px 0;
}
.log-line { white-space: pre-wrap; word-break: break-word; }
.log-empty { height: 4px; }

/* Log line colors */
.log-separator { color: var(--cyan);    opacity: .7; }
.log-reasoning { color: var(--yellow); }
.log-tool      { color: var(--magenta); }
.log-result    { color: var(--green); }
.log-success   { color: var(--green);  font-weight: 700; }
.log-error     { color: var(--red); }
.log-warning   { color: var(--orange); }
.log-flag      { color: var(--orange); font-weight: 700; }
.log-system    { color: var(--text-muted); }
.log-iter      { color: var(--cyan);   font-weight: 700; }
.log-subagent  { color: var(--blue); }
.log-default   { color: var(--text); }

/* ── Input bar ───────────────────────────────────────────── */
#input-bar {
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 12px 20px;
  background: var(--bg2);
  border-top: 2px solid var(--blue);
  flex-shrink: 0;
}
#input-question {
  color: var(--orange);
  font-weight: 600;
  font-size: 12px;
  line-height: 1.4;
}
.input-row {
  display: flex;
  gap: 8px;
}
.input-row input[type="text"] {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 13px;
}

/* ── Scrollbar ───────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Error toast ─────────────────────────────────────────── */
#error-toast {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: #b91c1c;
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 12px;
  max-width: 360px;
  display: none;
  z-index: 100;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
}
</style>
</head>
<body>

<!-- Header -->
<header id="header">
  <span class="logo">🤖 Agent UI</span>
  <span class="subtitle">hub.ag3nts.org</span>
  <div class="spacer"></div>
  <div class="ws-dot" id="ws-dot"></div>
  <span id="status-label">Łączenie...</span>
</header>

<!-- Layout -->
<div id="layout">

  <!-- Sidebar: sessions -->
  <aside id="sidebar">
    <div class="sidebar-title">📁 Sesje</div>
    <div id="sessions-list"><div class="no-sessions">ładowanie...</div></div>
  </aside>

  <!-- Main area -->
  <main id="main">

    <!-- Task Setup (before start) -->
    <div id="task-setup">
      <div class="ts-row">
        <label class="ts-label">Zadanie</label>
        <select id="task-select">
          <option value="">-- wybierz plik .md --</option>
        </select>
      </div>
      <div class="ts-row">
        <label class="ts-label">Własny problem (jeśli nie wybrano pliku)</label>
        <textarea id="custom-task" placeholder="Wpisz treść zadania..."></textarea>
      </div>
      <div class="ts-controls">
        <label class="toggle-label">
          <input type="checkbox" id="interactive-mode">
          Tryb interaktywny
        </label>
        <button class="btn btn-green"  id="btn-start">▶ Start</button>
        <button class="btn btn-blue"   id="btn-start-i">▶ Start [Interaktywny]</button>
      </div>
    </div>

    <!-- Run controls (during run) -->
    <div id="run-controls">
      <span class="run-task-label" id="run-task-label"></span>
      <button class="btn btn-orange" id="btn-stop">🛑 Stop</button>
      <button class="btn btn-red"    id="btn-force-stop">⛔ Force Stop</button>
    </div>

    <!-- Log viewer -->
    <div id="log-container">
      <div id="log"></div>
    </div>

    <!-- Input bar (hidden by default) -->
    <div id="input-bar">
      <div id="input-question"></div>
      <div class="input-row">
        <input type="text" id="user-input" placeholder="Twoja odpowiedź (Enter = akceptacja)...">
        <button class="btn btn-blue" id="btn-send">Wyślij ↵</button>
      </div>
    </div>

  </main>
</div>

<!-- Error toast -->
<div id="error-toast"></div>

<script>
class AgentUI {
  constructor() {
    this.ws = null;
    this.isRunning = false;
    this.awaitingInput = false;
    this.reconnectDelay = 1500;
    this.autoScroll = true;

    // DOM refs
    this.wsDot       = document.getElementById('ws-dot');
    this.statusLabel = document.getElementById('status-label');
    this.sessionsList= document.getElementById('sessions-list');
    this.taskSetup   = document.getElementById('task-setup');
    this.runControls = document.getElementById('run-controls');
    this.runTaskLabel= document.getElementById('run-task-label');
    this.logContainer= document.getElementById('log-container');
    this.logEl       = document.getElementById('log');
    this.inputBar    = document.getElementById('input-bar');
    this.inputQ      = document.getElementById('input-question');
    this.userInput   = document.getElementById('user-input');
    this.taskSelect  = document.getElementById('task-select');
    this.customTask  = document.getElementById('custom-task');
    this.errorToast  = document.getElementById('error-toast');

    // Bind events
    document.getElementById('btn-start')     .onclick = () => this.startAgent(false);
    document.getElementById('btn-start-i')   .onclick = () => this.startAgent(true);
    document.getElementById('btn-stop')      .onclick = () => this.send({type: 'graceful_stop'});
    document.getElementById('btn-force-stop').onclick = () => this.send({type: 'force_stop'});
    document.getElementById('btn-send')      .onclick = () => this.sendAnswer();
    this.userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); this.sendAnswer(); }
    });

    // Auto-scroll detection
    this.logContainer.addEventListener('scroll', () => {
      const el = this.logContainer;
      this.autoScroll = (el.scrollHeight - el.scrollTop - el.clientHeight) < 40;
    });

    this.connect();
  }

  // ── WebSocket ───────────────────────────────────────────────

  connect() {
    const url = `ws://${location.host}/ws`;
    this.ws = new WebSocket(url);

    this.ws.onopen = () => {
      this.wsDot.className = 'ws-dot ok';
      if (!this.isRunning) this.setStatus('Gotowy', '');
    };

    this.ws.onclose = () => {
      this.wsDot.className = 'ws-dot err';
      this.setStatus('Rozłączony — łączę ponownie...', '');
      setTimeout(() => this.connect(), this.reconnectDelay);
    };

    this.ws.onerror = () => {
      this.wsDot.className = 'ws-dot err';
    };

    this.ws.onmessage = e => {
      try { this.handleMessage(JSON.parse(e.data)); }
      catch(err) { console.error('WS parse:', err); }
    };
  }

  send(obj) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN)
      this.ws.send(JSON.stringify(obj));
  }

  // ── Message handling ────────────────────────────────────────

  handleMessage(msg) {
    switch (msg.type) {
      case 'sessions':      this.renderSessions(msg.sessions); break;
      case 'tasks':         this.renderTasks(msg.tasks); break;
      case 'running':       if (msg.is_running) this.setRunning(true, '(wznowiono)'); break;
      case 'agent_started': this.onAgentStarted(msg); break;
      case 'agent_done':    this.onAgentDone(false); break;
      case 'agent_stopped': this.onAgentDone(true); break;
      case 'log':           this.appendLog(msg.text); break;
      case 'input_request': this.showInput(msg); break;
      case 'error':         this.showError(msg.message); break;
    }
  }

  // ── Sessions ────────────────────────────────────────────────

  renderSessions(sessions) {
    this.sessionsList.innerHTML = '';
    if (!sessions.length) {
      this.sessionsList.innerHTML = '<div class="no-sessions">brak sesji</div>';
      return;
    }
    sessions.forEach(name => {
      const row = document.createElement('div');
      row.className = 'session-row';
      row.innerHTML = `
        <span class="session-name" title="${name}">${name}</span>
        <button class="btn-del" title="Usuń sesję ${name}">🗑</button>
      `;
      row.querySelector('.btn-del').onclick = () => this.deleteSession(name);
      this.sessionsList.appendChild(row);
    });
  }

  deleteSession(name) {
    if (confirm(`Usunąć sesję "${name}"?\n\nFolder tasks/${name}/ zostanie trwale usunięty.`))
      this.send({ type: 'delete_session', name });
  }

  // ── Tasks ───────────────────────────────────────────────────

  renderTasks(tasks) {
    const sel = this.taskSelect;
    const prev = sel.value;
    sel.innerHTML = '<option value="">-- wybierz plik .md --</option>';
    tasks.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.path;
      opt.textContent = t.name;
      sel.appendChild(opt);
    });
    const customOpt = document.createElement('option');
    customOpt.value = '__custom__';
    customOpt.textContent = '✏️  Własny problem...';
    sel.appendChild(customOpt);
    if (prev) sel.value = prev;
  }

  // ── Start ───────────────────────────────────────────────────

  startAgent(interactive) {
    if (this.isRunning) return;
    const sel = this.taskSelect.value;
    const custom = this.customTask.value.trim();

    this.logEl.innerHTML = '';
    this.autoScroll = true;

    if (sel && sel !== '__custom__') {
      this.send({ type: 'start', task_path: sel, interactive });
    } else if (custom) {
      this.send({ type: 'start_custom', task_text: custom, interactive });
    } else {
      this.showError('Wybierz zadanie z listy lub wpisz własny problem w polu tekstowym.');
    }
  }

  onAgentStarted(msg) {
    this.setRunning(true, msg.task_name);
    this.appendLog(`▶  Startuje agent: ${msg.task_name}  [interactive=${msg.interactive}]`, 'log-iter');
    this.appendLog('═'.repeat(55), 'log-separator');
  }

  onAgentDone(stopped) {
    this.setRunning(false, '');
    this.hideInput();
    this.appendLog('═'.repeat(55), 'log-separator');
    if (stopped) {
      this.appendLog('🛑  Agent zatrzymany.', 'log-warning');
      this.setStatus('Zatrzymany', 'stopped');
    } else {
      this.appendLog('✅  Agent zakończył pracę.', 'log-success');
      this.setStatus('Gotowy', 'done');
    }
  }

  setRunning(running, taskName) {
    this.isRunning = running;
    this.taskSetup.style.display   = running ? 'none'  : 'flex';
    this.runControls.style.display = running ? 'flex'  : 'none';
    this.runTaskLabel.textContent  = taskName ? `▶ ${taskName}` : '';
    if (running) this.setStatus(`Działa${taskName ? ': ' + taskName : ''}...`, 'running');
  }

  // ── Log ─────────────────────────────────────────────────────

  appendLog(text, forcedClass) {
    const line = document.createElement('div');
    line.className = 'log-line ' + (forcedClass || this.classifyLine(text));
    line.textContent = text;
    this.logEl.appendChild(line);
    if (this.autoScroll)
      this.logContainer.scrollTop = this.logContainer.scrollHeight;
  }

  classifyLine(t) {
    if (!t || !t.trim()) return 'log-empty';
    if (/[═─]{4,}/.test(t))                          return 'log-separator';
    if (/[╔╚╗╝║]/.test(t))                           return 'log-reasoning';
    if (/🔧/.test(t) || /^\s*[┌└]/.test(t))          return 'log-tool';
    if (/📥/.test(t) || /Odpowied[zź] systemu/.test(t)) return 'log-result';
    if (/✅|🏆/.test(t))                              return 'log-success';
    if (/❌|TOOL_ERROR|HTTP_\w+_ERROR|UNKNOWN_TOOL/.test(t)) return 'log-error';
    if (/⚠️/.test(t))                                 return 'log-warning';
    if (/🚩/.test(t))                                 return 'log-flag';
    if (/🗜|👁|🔮|🔄|RESET|COMPRESS|OBSERVER/.test(t)) return 'log-system';
    if (/Iteracja \d+/.test(t))                       return 'log-iter';
    if (/subagent|Subagent|delegate/i.test(t))        return 'log-subagent';
    if (/│/.test(t))                                  return 'log-tool';
    return 'log-default';
  }

  // ── Input bar ───────────────────────────────────────────────

  showInput(msg) {
    this.awaitingInput = true;
    const labels = {
      'plan':        '📋 PLAN — zaakceptuj [Enter] lub wpisz uwagi:',
      'ask_user':    '❓ PYTANIE OD AGENTA:',
      'interactive': '🎛 INTERAKTYWNY — zatwierdź [Enter] lub wpisz sugestię:',
      'reset':       '🔄 RESET KONTEKSTU — wpisz t/tak/y aby zaakceptować, n aby odrzucić:',
    };
    const label = labels[msg.prompt_type] || '❓';
    this.inputQ.textContent = msg.question
      ? `${label}  ${msg.question.slice(0, 200)}`
      : label;
    this.userInput.value = '';
    this.inputBar.style.display = 'flex';
    // Scroll do inputu
    this.logContainer.scrollTop = this.logContainer.scrollHeight;
    setTimeout(() => this.userInput.focus(), 50);
  }

  hideInput() {
    this.awaitingInput = false;
    this.inputBar.style.display = 'none';
    this.userInput.value = '';
  }

  sendAnswer() {
    if (!this.awaitingInput) return;
    const answer = this.userInput.value.trim();
    this.appendLog(`  ↩  Twoja odpowiedź: ${answer || '(Enter)'}`, 'log-system');
    this.send({ type: 'answer', text: answer });
    this.hideInput();
  }

  // ── Helpers ─────────────────────────────────────────────────

  setStatus(text, cls) {
    this.statusLabel.textContent = text;
    this.statusLabel.className = cls || '';
  }

  showError(msg) {
    const t = this.errorToast;
    t.textContent = '❌ ' + msg;
    t.style.display = 'block';
    clearTimeout(this._errorTimer);
    this._errorTimer = setTimeout(() => { t.style.display = 'none'; }, 6000);
  }
}

// Start
const ui = new AgentUI();
</script>
</body>
</html>
